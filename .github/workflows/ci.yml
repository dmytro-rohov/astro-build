name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, build, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint, type check and build
        run: npm run validate

      - name: Invalid site.json stops the build with readable errors
        run: npm run test:broken-site

      - name: Remote contact mode builds a static site
        run: npm run test:remote

      # Builds the site with test values and runs the browser tests.
      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      # Reuses the test build from the previous step.
      - name: Lighthouse
        run: npm run test:lighthouse

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7

  docker:
    name: Docker production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Builds the image and checks HSTS, contact form safety, GA debug mode and caching.
      - name: Build and test the image
        run: bash scripts/docker-smoke.sh

  catalog:
    name: Section catalog boundaries (8 archetypes)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Every variant with min and max content: no overflow at 320/768/1440 px, axe clean.
      - name: Catalog in every archetype
        run: npm run test:catalog

  fixtures:
    name: Fixture sites (3 businesses × 2 designs)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Every fixture: validate, build, site tests + axe; three of them: report gates (axe, Lighthouse).
      - name: Fixture sites
        run: npm run test:fixtures

      - name: Upload fixture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-reports
          path: .generated/fixtures/*/report.json
          if-no-files-found: ignore
